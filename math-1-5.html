<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>積木城堡｜一年級數學 方盒、圓罐、球</title>
<style>
:root{--u:min(4.4vw,2.6vh,23px);--ink:#2f2a22;--ink2:#6b604f;--wood:#a8693a;--wood2:#7d4a24;--sand:#f6e3b4;--leaf:#5fb35a;--leaf2:#3f8f3c;--y:#ffd54f;--g:#7bd389;--ok:#2fae5f;--card:#fff;--sky:#bfe6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfeec4;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:var(--u);touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#cfe6ff 0%,#f2f7ff 28%,#f6e8d0 29%,#ead2ad 100%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--u)*.6) calc(var(--u)*.8) calc(var(--u)*.6)}
.scr.on{display:flex}
/* buttons */
.btn{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.7) calc(var(--u)*1.1);font-weight:700;box-shadow:0 .25em 0 #c7b99a;font-size:calc(var(--u)*1.05);min-height:calc(var(--u)*2.6)}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 #c7b99a}
.btn.y{background:var(--y);box-shadow:0 .25em 0 #d7a91c}
.btn.g{background:var(--g);box-shadow:0 .25em 0 #4fa95f;color:#0b3d1b}
.btn.r{background:#ffb3b3;box-shadow:0 .25em 0 #d98080}
.btn.b{background:#9ccbff;box-shadow:0 .25em 0 #6aa2e0}
.btn.big{font-size:calc(var(--u)*1.45);padding:calc(var(--u)*.9)}
.btn:disabled{opacity:.45}
.bar{display:flex;gap:calc(var(--u)*.45);align-items:center;flex:none}
.bar .btn{padding:calc(var(--u)*.35) calc(var(--u)*.7);font-size:calc(var(--u)*.95);min-height:calc(var(--u)*2.4);white-space:nowrap}
.bar .sp{flex:1}
.ttl{font-weight:900;font-size:calc(var(--u)*1.3);line-height:1.15}
.sub{font-size:calc(var(--u)*.85);color:var(--ink2)}
.hide{display:none!important}
/* cover */
#cover{align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*.9);background:linear-gradient(#9fd8ff,#e6f7ff 45%,#ead2ad 46%,#d9b47c)}
.fence.rail{background:repeating-linear-gradient(90deg,#8a5a2f 0 calc(var(--u)*.5),transparent calc(var(--u)*.5) calc(var(--u)*1.5)),linear-gradient(transparent 35%,#777 35% 45%,transparent 45% 70%,#777 70% 80%,transparent 80%)}
.fence{width:min(90%,calc(var(--u)*22));height:calc(var(--u)*2.2);background:repeating-linear-gradient(90deg,#fff8e8 0 calc(var(--u)*1),transparent calc(var(--u)*1) calc(var(--u)*1.6)),linear-gradient(transparent 30%,#e9d3a8 30% 42%,transparent 42% 68%,#e9d3a8 68% 80%,transparent 80%);filter:drop-shadow(0 .1em 0 #a07a4a)}
#cover h1{margin:0;font-size:calc(var(--u)*2.5);line-height:1.15;color:#3b2a16;text-shadow:0 .08em 0 #fff}
#cover .scene{font-size:calc(var(--u)*3.6);line-height:1.1;letter-spacing:.05em}
#cover .scene .walk{display:inline-block;animation:walk 1.2s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(-.15em) rotate(-6deg)}}
#cover .hint{font-weight:900;font-size:calc(var(--u)*1.6);background:#fff;border-radius:99px;padding:.4em 1.4em;box-shadow:0 .2em 0 #c7b99a;animation:pulse 1.4s infinite}
#cover .vb{position:absolute;top:calc(var(--u)*.6);right:calc(var(--u)*.8)}
@keyframes pulse{50%{transform:scale(1.04)}}
/* home map */
#home{gap:calc(var(--u)*.4)}
#map{flex:1;min-height:0;position:relative;border-radius:calc(var(--u)*1);background:repeating-linear-gradient(0deg,transparent 0 calc(var(--u)*2.4),#c9a77a55 calc(var(--u)*2.4) calc(var(--u)*2.55)),linear-gradient(#bfe0ff,#e8d3b0);box-shadow:inset 0 0 0 .2em #ffffff66;overflow:hidden}
#mapPath{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stops{position:absolute;inset:0;display:grid;padding:calc(var(--u)*.45) calc(var(--u)*.5);gap:calc(var(--u)*.3)}
.deco{position:absolute;font-size:calc(var(--u)*2.2);opacity:.9;pointer-events:none;line-height:1}
.stop{position:relative;align-self:center;display:flex;align-items:center;gap:calc(var(--u)*.45);background:linear-gradient(#f4a259,#d9773a);border:.16em solid #8f4a1c;border-radius:calc(var(--u)*.3);border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.25) calc(var(--u)*.55);color:#fff;text-align:left;box-shadow:0 .25em 0 #5a3214;min-height:calc(var(--u)*2.7);z-index:2;width:100%}
.stop:active{transform:translateY(.12em)}
.stop .no{flex:none;width:calc(var(--u)*1.8);height:calc(var(--u)*1.8);border-radius:50%;background:#fff3c4;color:#7d4a24;font-weight:900;display:grid;place-items:center;font-size:calc(var(--u)*1)}
.stop .ic{flex:none;font-size:calc(var(--u)*1.6);line-height:1}
.stop .nm{flex:1;min-width:0;font-weight:900;font-size:calc(var(--u)*1.02);line-height:1.1;text-shadow:0 .06em 0 #0004}
.stop .nm small{display:block;font-weight:600;font-size:calc(var(--u)*.7);opacity:.95}
.stop .st{flex:none;font-size:calc(var(--u)*.85);letter-spacing:-.08em;color:#ffe066;text-shadow:0 .05em 0 #0005}
.stop.done{background:linear-gradient(#7c6cf0,#5546c9);border-color:#33288a}
.stop.next{animation:pulse 1.4s ease-in-out infinite;outline:.2em solid #fff;z-index:4}
.stop.lock{filter:grayscale(.7);opacity:.6}
.stop.school{background:linear-gradient(#ff9b8a,#d9533f);border-color:#8f2a1c;box-shadow:0 .25em 0 #6e1f14}
.stop .me{position:absolute;right:-.3em;top:-1.15em;font-size:calc(var(--u)*1.5);animation:hop 1s ease-in-out infinite;z-index:3}
@keyframes hop{50%{transform:translateY(-.25em)}}
.lmap .stop{flex-direction:column;justify-content:center;text-align:center;gap:.15em;padding:calc(var(--u)*.5) calc(var(--u)*.4);min-height:calc(var(--u)*5)}
.lmap .stop .no{position:absolute;left:.35em;top:.35em;width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);font-size:calc(var(--u)*.85)}
.lmap .stop .ic{font-size:calc(var(--u)*2)}
.lmap .stop .nm{flex:none;text-align:center}
.lmap .stop.school{flex-direction:row}.lmap .stop.school .no{position:static}.lmap .stop.school .nm{text-align:left}
.startlbl{position:absolute;left:calc(var(--u)*.4);bottom:calc(var(--u)*.2);font-weight:900;font-size:calc(var(--u)*.8);background:#fff;border-radius:99px;padding:.1em .6em;z-index:3;box-shadow:0 .12em 0 #0002}
.dock{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.45)}
.dock .btn{padding:calc(var(--u)*.4) calc(var(--u)*.2);font-size:calc(var(--u)*.9);line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:.1em}
.dock .btn span{font-size:calc(var(--u)*1.4)}
/* level */
.row2{display:flex;align-items:center;gap:calc(var(--u)*.45);flex:none;margin-top:calc(var(--u)*.4)}
.prog{display:flex;gap:calc(var(--u)*.25);flex:1;min-width:0;align-items:center}
.prog i{flex:1;height:calc(var(--u)*.75);border-radius:99px;background:#fff;box-shadow:0 0 0 .12em #c7b99a inset}
.prog i.ok{background:var(--ok)}.prog i.bad{background:#ffb347}.prog i.cur{background:var(--y);animation:pulse 1s infinite}
.spd{display:flex;gap:calc(var(--u)*.3);flex:none}
.spd .btn{min-height:calc(var(--u)*2.1);padding:calc(var(--u)*.2) calc(var(--u)*.5);font-size:calc(var(--u)*.82);box-shadow:0 .2em 0 #c7b99a;white-space:nowrap}
.hud{font-weight:900;font-size:calc(var(--u)*1.05);white-space:nowrap;flex:none}
.hud .bump{display:inline-block;animation:bump .5s}
.hud .hp{letter-spacing:-.05em;font-size:calc(var(--u)*.9)}
@keyframes bump{40%{transform:scale(1.5)}}
#qwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.45);margin-top:calc(var(--u)*.45)}
.card{background:var(--card);border-radius:calc(var(--u)*1);box-shadow:0 .2em 0 #c7b99a;padding:calc(var(--u)*.6) calc(var(--u)*.8)}
.toprow{display:flex;align-items:center;gap:calc(var(--u)*.4);flex:none;min-height:calc(var(--u)*2)}
.instr{font-size:calc(var(--u)*.8);color:#fff;background:#4f9a46;border-radius:99px;padding:.15em .8em;font-weight:700;min-width:0}
.teach{margin-left:auto;background:#fff3c4;border-radius:99px;padding:.25em .8em;font-weight:900;font-size:calc(var(--u)*.92);box-shadow:0 .18em 0 #d7a91c;white-space:nowrap;flex:none}
.teach:active{transform:translateY(.1em)}
.stem{font-size:calc(var(--u)*1.35);font-weight:800;line-height:1.35;text-align:center;flex:none}
.stem .num{color:#d1432d;font-size:1.15em}
.stem .zy{color:#2b6cb0;letter-spacing:.05em}
.fig{flex:1 1 auto;min-height:calc(var(--u)*5);display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.fit{flex:none;transform-origin:center center;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.5)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--u)*.5);flex:none;margin-top:auto}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt.pic{overflow:hidden}.opt.pic .grp{--es:calc(var(--u)*1.45);gap:.1em .12em}.opt.pic .hands svg{width:calc(var(--u)*2.2)}
.opt{position:relative;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.5);font-weight:900;font-size:calc(var(--u)*1.9);min-height:calc(var(--u)*3.4);box-shadow:0 .22em 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;line-height:1.15}
.opt.long{font-size:calc(var(--u)*1.15)}
.opt.pic{padding:calc(var(--u)*.3) calc(var(--u)*.3) calc(var(--u)*.3) calc(var(--u)*1.4);min-height:calc(var(--u)*4)}
.opt.c0{background:#ffe27a}.opt.c1{background:#9fd0ff}.opt.c2{background:#ffb1b1}.opt.c3{background:#a8e6b2}
.opt:active{transform:translateY(.15em)}
.opt.hot{outline:.25em solid #fff;box-shadow:0 0 0 .45em #ff9f1c;transform:scale(1.03);z-index:2}
.opt.off{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.opt.ok{background:var(--ok);color:#fff;animation:pop .5s}
.opt.no{animation:shake .4s}
.opt .nb{position:absolute;left:.3em;top:.25em;width:1.4em;height:1.4em;border-radius:50%;background:#fff9;font-size:calc(var(--u)*.7);display:grid;place-items:center;font-weight:900;color:#333}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%{transform:translateX(-.3em)}60%{transform:translateX(.3em)}}
.side{flex:none;margin-top:auto}
.fb{flex:none;min-height:calc(var(--u)*2.2);text-align:center;font-weight:800;font-size:calc(var(--u)*1.1);color:var(--ink2);display:flex;align-items:center;justify-content:center;line-height:1.3;padding:0 .3em}
.fb.ok{color:#1f8a4a}.fb.bad{color:#c2410c}.fb.ex{color:#1f4f99;background:#eef6ff;border-radius:calc(var(--u)*.7)}
.fb .bn{display:inline-block;min-width:1.6em;font-size:1.5em;color:#d1432d;animation:bump .5s}
/* picture groups */
.grp{display:grid;gap:calc(var(--u)*.25) calc(var(--u)*.35);justify-content:center;align-items:center;--es:calc(var(--u)*2.6)}
.grp .ct{position:relative;font-size:var(--es);line-height:1.1;width:1.2em;height:1.2em;display:grid;place-items:center;border-radius:.25em;transition:background .2s}
.grp.sm{--es:calc(var(--u)*1.7)}.grp.xs{--es:calc(var(--u)*1.3)}.grp.lg{--es:calc(var(--u)*3.2)}
.ct.hl{background:#fff3b0;box-shadow:0 0 0 .08em #ffb400}
.ct .bdg{position:absolute;right:-.15em;top:-.2em;min-width:.62em;height:.62em;padding:0 .08em;border-radius:99px;background:#e8590c;color:#fff;font-size:.42em;font-weight:900;display:grid;place-items:center;font-family:system-ui,sans-serif;line-height:1;animation:bump .4s;z-index:2}
.ct.x::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#e03131;font-weight:900;font-size:1.05em;text-shadow:0 0 .1em #fff}
.ct.x{opacity:.55}
.ct.dim{opacity:.25}
.box2{display:flex;gap:calc(var(--u)*.8);align-items:stretch;justify-content:center;flex-wrap:wrap}
.zone{border-radius:calc(var(--u)*.9);padding:calc(var(--u)*.4) calc(var(--u)*.6);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.25);background:#ffffffaa}
.zone .zl{font-weight:900;font-size:calc(var(--u)*.95);color:#5b4a2f}
.zone.pond{background:radial-gradient(#9ed8ff,#5fb2ef);border:.15em solid #3e8fd1}
.zone.plate{background:radial-gradient(#fff 55%,#e7dccb);border-radius:50%;padding:calc(var(--u)*1.2);min-width:calc(var(--u)*8);min-height:calc(var(--u)*6);justify-content:center;border:.15em solid #cdbfa8}
.zone.bowl{background:radial-gradient(ellipse at 50% 40%,#e9f7ff,#bfe3fa);border-radius:40% 40% 48% 48%;border:.18em solid #8cc4e8;min-width:calc(var(--u)*8);min-height:calc(var(--u)*6);justify-content:center}
.zone.tree{background:#d9f2c9;border:.15em solid #7bbf62}
.zone.hl{box-shadow:0 0 0 .25em #ffb400}
.empty{font-size:calc(var(--u)*1);color:#9a8f7c;font-weight:700}
.ncard{display:inline-grid;place-items:center;min-width:calc(var(--u)*3.6);height:calc(var(--u)*4);padding:0 .3em;background:#fff;border:.18em solid #e8590c;border-radius:calc(var(--u)*.6);font-weight:900;font-size:calc(var(--u)*2.8);color:#d1432d;box-shadow:0 .2em 0 #e0c9a8}
.ncard.sm{min-width:calc(var(--u)*2.6);height:calc(var(--u)*2.9);font-size:calc(var(--u)*2)}
.hands{display:flex;gap:calc(var(--u)*.2);align-items:flex-end}
.hands svg{width:calc(var(--u)*3.6);height:auto}
.hands.sm svg{width:calc(var(--u)*2.4)}.hands.lg svg{width:calc(var(--u)*5)}
.circs{display:grid;grid-template-columns:repeat(5,auto);gap:calc(var(--u)*.2)}
.circs i{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);border-radius:50%;border:.2em solid #e8590c;display:block}
.circs.sm i{width:calc(var(--u)*1.05);height:calc(var(--u)*1.05);border-width:.16em}
.circs i.hl{background:#fff3b0}
.zh{font-weight:900;font-size:calc(var(--u)*2.2);color:#2b6cb0}
/* ten frame (draw) */
.frame{display:grid;grid-template-columns:repeat(5,calc(var(--u)*2.9));grid-auto-rows:calc(var(--u)*2.9);border:.18em solid #8a6a3f;background:#fffaf0;border-radius:calc(var(--u)*.4)}
.frame b{border:.08em dashed #c9b28b;display:grid;place-items:center}
.frame b::after{content:"";width:72%;height:72%;border-radius:50%;border:.22em solid transparent;transition:transform .2s}
.frame b.on::after{border-color:#e8590c;animation:pop .35s}
.frame b.pre::after{border-color:#8f8778}
.frame b.hl{background:#fff3b0}
.frame.tap{cursor:pointer;box-shadow:0 0 0 .2em #ffd66b}
.drawbar{display:flex;gap:calc(var(--u)*.5);justify-content:center;flex:none;margin-top:auto}
.drawbar .btn{flex:1;max-width:calc(var(--u)*10)}
/* number pad 0-10 */
.npad{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*.35);flex:none;margin-top:auto}
.npad .k{background:#fff;border-radius:calc(var(--u)*.8);font-weight:900;font-size:calc(var(--u)*1.7);min-height:calc(var(--u)*2.9);box-shadow:0 .2em 0 #c7b99a}
.npad .k:active{transform:translateY(.15em)}
.npad .k.hot{background:#fff3b0}
.ansbox{display:flex;justify-content:center;gap:calc(var(--u)*.4);flex-wrap:wrap;align-items:center;flex:none}
.blank{min-width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:calc(var(--u)*.6);background:#fff;border:.15em dashed #8a7a5a;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.9);padding:0 .3em}
.blank.cur{border-color:#ff9f1c;background:#fff6dc;box-shadow:0 0 0 .2em #ffd66b;animation:pulse 1s infinite}
.blank.fix{background:#e8f9ee;border:.15em solid var(--ok);color:#0b6b36}
.blank.rev{background:#fff1d0;border:.15em solid #ff9f1c}
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--u)*.3)}
.chain .nd{min-width:calc(var(--u)*3);height:calc(var(--u)*3.2);display:grid;place-items:center;border-radius:calc(var(--u)*.6);background:#eaf7e2;border:.15em solid #7bbf62;font-weight:900;font-size:calc(var(--u)*1.9)}
.chain .ar{color:#7d4a24;font-weight:900;font-size:calc(var(--u)*1.2)}
.chain .blank{min-width:calc(var(--u)*2.7);height:calc(var(--u)*2.9);font-size:calc(var(--u)*1.7)}
.chain .nd{min-width:calc(var(--u)*2.7);height:calc(var(--u)*2.9)}
.chain{gap:calc(var(--u)*.15)}.chain .ar{font-size:calc(var(--u)*1)}
.chain .hl{box-shadow:0 0 0 .22em #ffb400}
/* match */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.45) calc(var(--u)*1.4);flex:none;margin-top:auto}
.mt button{background:#fff;border-radius:calc(var(--u)*.8);font-weight:900;font-size:calc(var(--u)*1.7);min-height:calc(var(--u)*3.4);box-shadow:0 .18em 0 #c7b99a;padding:.15em .3em;display:flex;align-items:center;justify-content:center}
.mt .grp{--es:calc(var(--u)*1.6)}.mt .circs i{width:calc(var(--u)*1.3);height:calc(var(--u)*1.3)}.mt button{min-height:calc(var(--u)*4)}
.mt button.sel{background:#fff3b0;outline:.2em solid #ffb400}
.mt button.done{background:#c9f0d4;pointer-events:none}
.mt button.no{animation:shake .4s}
/* flip */
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.5);flex:1;min-height:0;align-content:center}
.fc{position:relative;border-radius:calc(var(--u)*.9);min-height:calc(var(--u)*5.2);background:repeating-linear-gradient(45deg,#c98a55 0 .5em,#b9774a .5em 1em);border:.18em solid #6e3f1c;box-shadow:0 .22em 0 #5a3214;display:grid;place-items:center;font-size:calc(var(--u)*2);color:#fff;font-weight:900}
.fc .face{display:none}
.fc.up,.fc.got{background:#fff;border-color:#c7b99a}
.fc.up .face,.fc.got .face{display:flex}
.fc.up .back,.fc.got .back{display:none}
.fc.got{background:#d8f5df;border-color:var(--ok)}
.fc .grp{--es:calc(var(--u)*1.25)}
/* lesson */
.les{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.4)}
.les-dots{display:flex;gap:.3em;justify-content:center;flex:none}
.les-dots i{width:.7em;height:.7em;border-radius:50%;background:#fff;box-shadow:0 0 0 .1em #c7b99a inset}
.les-dots i.ok{background:var(--ok)}.les-dots i.cur{background:var(--y)}
.les-say{flex:none;background:#fff;border-radius:calc(var(--u)*.9);padding:calc(var(--u)*.5) calc(var(--u)*.8);font-weight:800;font-size:calc(var(--u)*1.25);line-height:1.4;text-align:center;min-height:calc(var(--u)*3.6);display:flex;align-items:center;justify-content:center;box-shadow:0 .2em 0 #c7b99a}
.les-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.les-eq{flex:none;text-align:center;font-weight:900;font-size:calc(var(--u)*1.35);min-height:1.5em;color:#7d4a24}
.les-eq b{color:#d1432d;font-size:1.25em}
.les-q{flex:none}
.les-btns{flex:none;display:flex;gap:calc(var(--u)*.5)}

<script>
'use strict';
/* ================= 基本工具 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seedRand(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function withSeed(seed,fn){const old=Math.random;Math.random=seedRand(seed);try{return fn()}finally{Math.random=old}}

/* ===== 數字讀法 ===== */
const DG=['零','一','二','三','四','五','六','七','八','九','十'];
const zh=n=>{n=+n;return n<=10?DG[n]:(n<20?'十'+(n%10?DG[n%10]:''):DG[Math.floor(n/10)]+'十'+(n%10?DG[n%10]:''))};
const ZY=['ㄌㄧㄥˊ','ㄧ','ㄦˋ','ㄙㄢ','ㄙˋ','ㄨˇ','ㄌㄧㄡˋ','ㄑㄧ','ㄅㄚ','ㄐㄧㄡˇ','ㄕˊ'];
const MW='隻個根條顆朵輛本枝把片張瓶塊串節架杯位盆罐輪';
// 語音容易唸錯的詞，換成同音字（「數一數」要唸ㄕㄨˇ）
const SAYFIX=[['數一數','暑一暑'],['數數看','暑暑看'],['一起數','一起暑'],['接著數','接著暑'],['再數','再暑'],['數到','暑到'],['先數','先暑'],['重數','重暑'],['數的時候','暑的時候'],['一個一個數','一個一個暑'],['一隻一隻數','一隻一隻暑'],['數完','暑完'],['來數','來暑'],['數錯','暑錯'],['數一次','暑一次'],['數清楚','暑清楚'],['數數','暑暑']];
let _emo=null;try{_emo=new RegExp('\\p{Extended_Pictographic}','gu')}catch(e){}
function spoken(s){
  s=String(s);
  SAYFIX.forEach(([a,b])=>{s=s.split(a).join(b)});
  ZY.forEach((z,i)=>{s=s.split('「'+z+'」').join(DG[i])});
  s=s.replace(/[（(][\s　]*[）)]/g,'空格').replace(/□/g,'空格').replace(/○/g,'圈圈').replace(/[╳✕]/g,'叉叉').replace(/√/g,'勾').replace(/[「」『』【】]/g,'');
  if(_emo)s=s.replace(_emo,'');
  s=s.replace(/️/g,'');
  s=s.replace(new RegExp('(^|[^0-9第])2(?=['+MW+'])','g'),'$1兩');
  s=s.replace(/\d+/g,m=>zh(+m));
  return s.replace(/[＋+]/g,'加').replace(/[（）()]/g,'，').replace(/\s+/g,' ');
}

/* ===== 排程（可暫停）===== */
const CLK={paused:false,pend:[],timers:new Set()};
function later(fn,ms){
  const t=setTimeout(()=>{CLK.timers.delete(t);if(CLK.paused)CLK.pend.push(fn);else fn()},ms);
  CLK.timers.add(t);return t;
}
function clearLater(){CLK.timers.forEach(clearTimeout);CLK.timers.clear();CLK.pend=[]}
function setPaused(p){
  CLK.paused=p;
  if(p){TTS.stop()}
  else{const q=CLK.pend;CLK.pend=[];q.forEach(f=>f())}
}
let _lastTap=0;
function guard(ms){const n=Date.now();if(n-_lastTap<ms)return false;_lastTap=n;return true}

/* ===== 設定 / 狀態（每次打開重新開始）===== */
const RATES=[[0.5,'很慢'],[0.62,'慢慢唸'],[0.75,'普通'],[0.9,'快一點']];
const S={voice:true,rate:0.62,count:6,sfx:true,done:{},stars:{},instrSeen:{},lesSeen:{},started:false,unlockAll:true};
let _store=null;try{_store=window.localStorage}catch(e){}
const dayKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
function dailyDone(){try{return _store&&_store.getItem('m11-daily')==String(dayKey())}catch(e){return false}}
function setDailyDone(){try{_store&&_store.setItem('m11-daily',String(dayKey()))}catch(e){}}

/* ===== 語音 ===== */
const TTS={ok:'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',gen:0,
  stop(){this.gen++;try{this.ok&&speechSynthesis.cancel()}catch(e){}},
  est(t){return Math.max(450,String(t).length*(S.rate<0.6?380:S.rate<0.7?320:S.rate<0.85?260:210))},
  one(text,gen,done){
    if(gen!==this.gen) return;
    let fin=false;const f=()=>{if(fin)return;fin=true;clearTimeout(tm);done&&done()};
    const tm=setTimeout(f,this.est(text)*1.8+1200);
    try{
      const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=S.rate;u.pitch=1.05;
      u.onend=f;u.onerror=f;speechSynthesis.speak(u);
    }catch(e){clearTimeout(tm);setTimeout(f,this.est(text))}
  },
  busy(){try{return this.ok&&(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){return false}}
};
// items: [string | {t,on,gap}]：一段一段唸，唸之前先做 on（畫面跟著動）
function speakSeq(items,onAll,gap){
  TTS.stop(); const gen=TTS.gen; gap=gap==null?300:gap;
  let i=0;
  const next=()=>{
    if(gen!==TTS.gen) return;
    if(i>=items.length){onAll&&onAll();return}
    const it=items[i++],t=typeof it==='string'?it:it.t,on=typeof it==='string'?null:it.on,g=(typeof it!=='string'&&it.gap!=null)?it.gap:gap;
    on&&on();
    const txt=spoken(t||'');
    if(!S.voice||!TTS.ok||!txt.trim()){later(()=>gen===TTS.gen&&next(),txt.trim()?(S.voice?TTS.est(txt)*.6:Math.max(600,TTS.est(txt)*.45)):g+200);return}
    TTS.one(txt,gen,()=>later(()=>gen===TTS.gen&&next(),g));
  };
  if(CLK.paused){CLK.pend.push(()=>{if(gen===TTS.gen)next()});return}
  next();
}
function say(t,cb){speakSeq([t],cb)}
function rateIdx(){let k=0;RATES.forEach(([v],i)=>{if(Math.abs(v-S.rate)<Math.abs(RATES[k][0]-S.rate))k=i});return k}
function stepRate(d){
  const k=Math.max(0,Math.min(RATES.length-1,rateIdx()+d));S.rate=RATES[k][0];
  toast((d<0?'🐢 ':'🐇 ')+'現在：'+RATES[k][1]);SFX.tap();
  if(!TTS.busy())speakSeq(['這樣的速度，聽得清楚嗎？']);
}

/* ===== 音效 ===== */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')try{AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,vol,slide){
  const c=ac();if(!c||!S.sfx)return;
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime+t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t0+d);
  g.gain.setValueAtTime(0.0001,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol||0.15,c.currentTime+t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+d);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+0.05);
}
function noise(t0,d,vol,hp){
  const c=ac();if(!c||!S.sfx)return;
  const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),da=b.getChannelData(0);for(let i=0;i<da.length;i++)da[i]=(Math.random()*2-1)*(1-i/da.length);
  const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=vol||0.2;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+t0);
}
const SFX={
  ok(){const base=pick([523,587,659]);tone(base,0,.12,'triangle',.18);tone(base*1.25,.1,.12,'triangle',.18);tone(base*1.5,.2,.22,'triangle',.18)},
  bad(){tone(220,0,.22,'sine',.12,140)},
  tap(){tone(660,0,.05,'square',.04)},
  cnt(i){tone(440*Math.pow(1.06,i||0),0,.09,'triangle',.12)},
  pop(){tone(300,0,.08,'sine',.15,900)},
  step(){tone(200,0,.08,'triangle',.14,120);tone(260,.12,.08,'triangle',.14,160)},
  bird(){tone(1800,0,.07,'sine',.08,2600);tone(2000,.12,.07,'sine',.08,2800)},
  clap(){for(let i=0;i<22;i++)noise(i*.07+Math.random()*.03,.05,.1+Math.random()*.1,1200+Math.random()*1500)},
  fire(){tone(500,0,.5,'sine',.1,1800);noise(.5,.5,.18,300);for(let i=0;i<8;i++)noise(.55+i*.06,.1,.08,3000)},
  fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.14,.25,'triangle',.2))},
  bell(){[1047,1319,1568].forEach((f,i)=>tone(f,i*.18,.5,'sine',.14))},
  swap(){tone(400,0,.08,'sine',.12,800);tone(800,.08,.1,'sine',.12,1200)}
};
function confetti(n,em){
  n=n||22;em=em||['🍃','🌸','⭐','✨','🌼','🍀'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='confe';s.textContent=pick(em);s.style.left=Math.random()*96+'vw';s.style.animationDelay=Math.random()*.8+'s';s.style.animationDuration=1.8+Math.random()*1.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4200)}
}
function toast(t){$$('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}

/* ================= 圖形 ================= */
// 東西：名稱、圖、量詞
const IT={
  bird:['小鳥','🐦','隻'],elephant:['大象','🐘','隻'],bear:['小熊','🐻','隻'],rabbit:['兔子','🐰','隻'],squirrel:['松鼠','🐿️','隻'],
  carrot:['胡蘿蔔','🥕','根'],potato:['馬鈴薯','🥔','顆'],tomato:['番茄','🍅','顆'],frog:['青蛙','🐸','隻'],ladybug:['瓢蟲','🐞','隻'],
  pig:['小豬','🐷','隻'],mouse:['老鼠','🐭','隻'],cat:['小貓','🐱','隻'],dog:['小狗','🐶','隻'],monkey:['猴子','🐵','隻'],
  fish:['魚','🐟','條'],duck:['鴨子','🦆','隻'],butterfly:['蝴蝶','🦋','隻'],bee:['蜜蜂','🐝','隻'],snail:['蝸牛','🐌','隻'],penguin:['企鵝','🐧','隻'],
  turtle:['烏龜','🐢','隻'],chick:['小雞','🐤','隻'],owl:['貓頭鷹','🦉','隻'],
  car:['汽車','🚗','輛'],bus:['公車','🚌','輛'],candy:['糖果','🍬','顆'],balloon:['氣球','🎈','顆'],flower:['花','🌸','朵'],sunflower:['向日葵','🌻','朵'],leaf:['葉子','🍃','片'],
  ball:['足球','⚽','顆'],basketball:['籃球','🏀','顆'],tennis:['網球','🎾','顆'],apple:['蘋果','🍎','個'],banana:['香蕉','🍌','根'],pudding:['布丁','🍮','個'],
  book:['書','📘','本'],pencil:['鉛筆','✏️','枝'],strawberry:['草莓','🍓','顆'],cherry:['櫻桃','🍒','顆'],lolli:['棒棒糖','🍭','枝'],cake:['蛋糕','🍰','塊'],
  tree:['樹','🌳','棵'],bread:['麵包','🍞','個'],milk:['牛奶','🥛','瓶'],juice:['果汁','🧃','瓶'],bike:['腳踏車','🚲','輛'],star:['星星','⭐','顆'],
  bone:['骨頭','🦴','根'],grape:['葡萄','🍇','串'],peach:['桃子','🍑','顆'],cup:['杯子','☕','個'],sock:['手套','🧤','隻'],corn:['玉米','🌽','根'],
  ruler:['尺','📏','把'],eraser:['橡皮擦','🧽','個'],cookie:['餅乾','🍪','片'],mushroom:['香菇','🍄','朵']
};
const nm=k=>IT[k][0],em=k=>IT[k][1],mw=k=>IT[k][2];
// 一群東西：每一個都是 .ct，可以點著數
function grpHTML(k,n,o){
  o=o||{};
  if(!n) return '';
  const e=em(k),g=o.g?` data-g="${o.g}"`:'';
  let size=o.size||(n<=3?'lg':n<=6?'':n<=10?'':'sm');
  if(o.scatter){
    const c=n<=4?3:n<=8?4:5,r=Math.ceil(n*1.35/c),cells=shuffle(Array.from({length:c*r},(_,i)=>i)).slice(0,n).sort((a,b)=>a-b);
    let h='';for(let i=0;i<c*r;i++){
      if(cells.includes(i)){const dx=(Math.random()*.36-.18).toFixed(2),dy=(Math.random()*.36-.18).toFixed(2),rot=rnd(-14,14);h+=`<span class="ct"${g} style="transform:translate(${dx}em,${dy}em) rotate(${rot}deg)">${e}</span>`}
      else h+='<span></span>';
    }
    return `<div class="grp ${size}" style="grid-template-columns:repeat(${c},auto)">${h}</div>`;
  }
  const cols=o.cols||(n<=5?n:5);
  return `<div class="grp ${size}" style="grid-template-columns:repeat(${cols},auto)">${Array.from({length:n},()=>`<span class="ct"${g}>${e}</span>`).join('')}</div>`;
}
// 手指頭：0~5 一隻手，6~10 兩隻手（先一隻手5，再加）
function handSVG(k,mir){
  const sk='#ffd7b0',st='#c98a5a';
  const fx=[18,29,40,51];let f='';
  fx.forEach((x,i)=>{const up=k>i;f+=up?`<rect class="fu" x="${x}" y="${[10,6,9,16][i]}" width="9.5" height="${[36,40,37,30][i]}" rx="4.7" fill="${sk}" stroke="${st}" stroke-width="1.6"/>`:`<rect x="${x}" y="33" width="9.5" height="12" rx="4.7" fill="${sk}" stroke="${st}" stroke-width="1.6"/>`});
  const th=k>=5?`<rect class="fu" x="3" y="34" width="10" height="28" rx="5" fill="${sk}" stroke="${st}" stroke-width="1.6" transform="rotate(-28 8 60)"/>`:'';
  const thIn=k<5?`<rect x="15" y="50" width="26" height="10" rx="5" fill="#f7c79c" stroke="${st}" stroke-width="1.4"/>`:'';
  return `<svg viewBox="0 0 66 86"><g ${mir?'transform="translate(66 0) scale(-1 1)"':''}>${f}${th}<rect x="15" y="40" width="46" height="40" rx="13" fill="${sk}" stroke="${st}" stroke-width="1.6"/>${thIn}</g></svg>`;
}
function handsHTML(n,cls){
  if(n<=5) return `<div class="hands ${cls||''}">${handSVG(n)}</div>`;

function circsHTML(n,cls){return n?`<div class="circs ${cls||''}" style="grid-template-columns:repeat(${Math.min(5,n)},auto)">${'<i></i>'.repeat(n)}</div>`:'<div class="empty">沒有○</div>'}
const ncard=(n,cls)=>`<span class="ncard ${cls||''}">${n}</span>`;

/* 把圖放大到剛好塞滿（手機、平板都看得到整張） */
function fitFig(fig){
  const f=fig&&fig.querySelector(':scope>.fit');if(!f)return;
  f.style.transform='none';
  const cw=fig.clientWidth-8,ch=fig.clientHeight-6,ow=f.offsetWidth,oh=f.offsetHeight;
  if(cw<=0||ch<=0||!ow||!oh)return;
  const s=Math.max(.3,Math.min(cw/ow,ch/oh,1.8));
  f.style.transform='scale('+s.toFixed(3)+')';
}
function fitAll(r){$$('.fig',r||document).forEach(fitFig)}
window.addEventListener('resize',()=>{fitAll();if(CURSCR==='home')drawPath()});

/* 每個 .ct 都可以點：點一下出現 1、2、3…（幫忙數，不會改答案） */
function bindCount(root){
  let c=0;
  $$('.ct',root).forEach(el=>el.onclick=e=>{
    e.stopPropagation();if(CLK.paused)return;
    if(el.querySelector('.bdg')){ // 全部數完再點，重新數
      if($$('.ct',root).every(x=>x.querySelector('.bdg'))){$$('.ct .bdg',root).forEach(b=>b.remove());$$('.ct',root).forEach(x=>x.classList.remove('hl'));c=0}
      return;
    }
    c++;badge(el,c);SFX.cnt(c);speakSeq([zh(c)],null,0);
  });
}
function badge(el,n){let b=el.querySelector('.bdg');if(!b){b=document.createElement('i');b.className='bdg';el.appendChild(b)}b.textContent=n;b.style.animation='none';void b.offsetWidth;b.style.animation=''}
function clearBadges(root){$$('.ct',root).forEach(x=>{x.classList.remove('hl');const b=x.querySelector('.bdg');b&&b.remove()})}

/* ================= 比長短：圖形 ================= */
const COL=[['紅色','#e5484d','#b42c31'],['藍色','#3b82f6','#1e5fcf'],['綠色','#22a35a','#16753f'],['黃色','#f5b800','#b98a00'],['紫色','#8b5cf6','#6534d1'],['橘色','#f97316','#c2560c']];
const cName=i=>COL[i][0],cFill=i=>COL[i][1],cDark=i=>COL[i][2];
const swatch=i=>`<span class="sw" style="background:${cFill(i)}"></span>`;
const svgW=(w,h,inner,cls)=>`<svg class="gsvg ${cls||''}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${inner}</svg>`;

/* ---- 橫的東西（鉛筆、蠟筆、緞帶、繩子、蛇、吸管、筷子、火車） ---- */
function hObj(kind,len,ci,x,y){

function stemHtml(s){return esc(s).replace(/「(ㄌㄧㄥˊ|ㄧ|ㄦˋ|ㄙㄢ|ㄙˋ|ㄨˇ|ㄌㄧㄡˋ|ㄑㄧ|ㄅㄚ|ㄐㄧㄡˇ|ㄕˊ)」/g,'「<span class="zy">$1</span>」').replace(/(\d{1,2})/g,'<span class="num">$1</span>').replace(/\n/g,'<br>')}
const NB=['①','②','③','④'];
function setFb(host,t,c,html){const f=$('.fb',host);if(!f)return;f.className='fb '+(c||'');if(html)f.innerHTML='<span>'+(t||'')+'</span>';else f.textContent=t||''}

function buildShell(q,host,ctx){
  const type=q.type==='num'&&q.chain?'chain':q.type;
  const seen=S.instrSeen[type]||0,showI=seen<2&&!q.noInstr;
  host.innerHTML='';host.classList.add('land');
  const el=(cls,html)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;host.appendChild(d);return d};
  el('toprow',(showI?`<div class="instr">${esc(INSTR[type]||INSTR.mc)}</div>`:'')+(q.ex?'<button class="teach">💡 教我怎麼做</button>':''));
  el('stem card',stemHtml(q.stem));
  if(q.fig){const f=el('fig',`<div class="fit">${q.fig}</div>`);if(!q.noCount)bindCount(f)}
  el('fb','');
  const side=document.createElement('div');side.className='side';host.appendChild(side);
  ctx.side=side;
  ctx.speakHead=[];
  if(showI)ctx.speakHead.push(INSTR[type]);
  ctx.speakHead.push(q.say||q.stem);
  S.instrSeen[type]=seen+1;
}
function afterBuild(host){requestAnimationFrame(()=>requestAnimationFrame(()=>fitAll(host)));setTimeout(()=>fitAll(host),260)}

/* ---- 選擇題（數字或圖） ---- */
function rMC(q,host,ctx){
  buildShell(q,host,ctx);
  const opts=q.opts.map(o=>typeof o==='object'?o:{t:String(o)}),n=opts.length;
  const pic=opts.some(o=>o.html),long=opts.some(o=>!o.html&&o.t.length>3);
  const box=document.createElement('div');
  box.className='opts '+(long&&opts.some(o=>o.t.length>7)?'one':n===3?'three':'');
  opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt c'+(i%4)+(long?' long':'')+(pic?' pic':'');
    b.innerHTML=`<span class="nb">${NB[i]}</span>`+(o.html||esc(o.t));
    box.appendChild(b);
  });
  ctx.side.appendChild(box);
  const bs=$$('.opt',box);
  let tries=0,locked=false;
  const pick1=i=>{
    if(locked||ctx.dead())return;if(!guard(300))return;
    stopSeq();
    if(i===q.ans){
      locked=true;bs[i].classList.add('ok');bs.forEach((b,j)=>j!==i&&b.classList.add('off'));
      ctx.finish(tries===0,q);
    }else{
      tries++;bs[i].classList.add('no','off');SFX.bad();
      if(tries>=ctx.maxTries){locked=true;bs[q.ans].classList.add('ok');bs.forEach((b,j)=>j!==q.ans&&b.classList.add('off'));ctx.finish(false,q,true)}
      else ctx.hint(q);
    }
  };
  bs.forEach((b,i)=>b.onclick=()=>pick1(i));
  ctx.auto=()=>{_lastTap=0;pick1(q.ans)};
  ctx.autoWrong=()=>{const j=bs.findIndex((b,i)=>i!==q.ans&&!b.classList.contains('off'));if(j>=0){_lastTap=0;pick1(j);return true}return false};
  const hot=i=>{bs.forEach(x=>x.classList.remove('hot'));if(i>=0)bs[i].classList.add('hot')};
  ctx.speakTail=q.noOptSay?[]:[{t:pic?'有四個圖，':'答案可能是：',on:()=>{}}].concat(opts.map((o,i)=>({t:pic?(o.say||('第'+zh(i+1)+'個')):(o.say||o.t),on:()=>hot(i),gap:pic?700:420})));
  ctx.speakEnd=()=>hot(-1);
  afterBuild(host);
}

/* ---- 數字鍵 0～10（也可以做「數字排排站」的空格） ---- */
function rNum(q,host,ctx){
  buildShell(q,host,ctx);
  const tpl=q.tpl||[{b:0}];
  const area=document.createElement('div');area.className=q.chain?'chain '+(q.chainCls||''):'ansbox';
  tpl.forEach((p,i)=>{
    const s=document.createElement('span');
    if(typeof p==='string'){
      if(q.chain){s.className=p==='→'?'ar':'nd';s.textContent=p}
      else{s.style.cssText='font-weight:900;font-size:calc(var(--u)*1.5)';s.textContent=p}
    }else{s.className='blank';s.innerHTML='&nbsp;'}
    area.appendChild(s);
  });
  // 空格放在題目下面（直式），數字鍵放在旁邊
  host.insertBefore(area,$('.fb',host));
  const pad=document.createElement('div');pad.className='npad';
  for(let k=0;k<=10;k++){const b=document.createElement('button');b.className='k';b.dataset.k=k;b.textContent=k;pad.appendChild(b)}
  const sp=document.createElement('button');sp.className='k';sp.style.fontSize='calc(var(--u)*.9)';sp.textContent='擦掉';pad.appendChild(sp);
  ctx.side.appendChild(pad);
  const blanks=$$('.blank',area),ans=q.blanks.map(String);
  let cur=0,tries=0,anyBad=false,done=false;
  const mark=()=>blanks.forEach((b,i)=>b.classList.toggle('cur',i===cur&&!done));
  const press=k=>{
    if(done||ctx.dead())return;if(!guard(320))return;stopSeq();
    const b=blanks[cur];
    if(String(k)===ans[cur]){
      b.classList.remove('cur');b.classList.add('fix');b.textContent=k;SFX.ok();
      cur++;tries=0;
      if(cur>=blanks.length){done=true;mark();ctx.finish(!anyBad,q,false)}else{mark();if(q.chain)speakSeq(['下一個空格。'])}
    }else{
      tries++;anyBad=true;SFX.bad();b.textContent=k;b.style.animation='shake .4s';
      setTimeout(()=>{b.style.animation='';if(!b.classList.contains('fix')&&!b.classList.contains('rev'))b.innerHTML='&nbsp;'},600);
      if(tries>=ctx.maxTries){
        setTimeout(()=>{b.classList.remove('cur');b.classList.add('rev');b.textContent=ans[cur];cur++;tries=0;
          if(cur>=blanks.length){done=true;mark();ctx.finish(false,q,true)}else mark()},620);
      }else ctx.hint(q);
    }
  };
  $$('.k',pad).forEach(b=>{if(b.dataset.k!=null)b.onclick=()=>press(+b.dataset.k)});
  sp.onclick=()=>{};
  sp.style.visibility='hidden';
  mark();
  ctx.auto=()=>{_lastTap=0;press(+ans[cur])};
  ctx.autoWrong=()=>{if(done)return false;_lastTap=0;press(ans[cur]==='9'?8:9);return true};
  ctx.speakTail=[];ctx.speakEnd=()=>{};
  afterBuild(host);
}

/* ---- 畫○（十格框） ---- */
function rFrame(q,host,ctx){
  buildShell(q,host,ctx);
  const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;gap:calc(var(--u)*.5);align-items:center';
  const fr=document.createElement('div');fr.className='frame tap';
  for(let i=0;i<10;i++){const c=document.createElement('b');if(i<(q.pre||0))c.className='on pre';fr.appendChild(c)}
  wrap.appendChild(fr);
  const bar=document.createElement('div');bar.className='drawbar';bar.style.width='100%';
  bar.innerHTML='<button class="btn r">擦掉一個</button><button class="btn g big">畫好了</button>';
  wrap.appendChild(bar);ctx.side.appendChild(wrap);
  const cells=$$('b',fr),[er,ok]=$$('.btn',bar);
  let cnt=q.pre||0,tries=0,locked=false;
  const draw=()=>cells.forEach((c,i)=>{c.classList.toggle('on',i<cnt);c.classList.toggle('pre',i<(q.pre||0))});
  fr.onclick=()=>{if(locked||ctx.dead()||cnt>=10)return;if(!guard(160))return;stopSeq();cnt++;draw();SFX.pop();speakSeq([zh(cnt)],null,0)};
  er.onclick=()=>{if(locked||ctx.dead()||cnt<=(q.pre||0))return;if(!guard(200))return;cnt--;draw();SFX.tap()};
  ok.onclick=()=>{
    if(locked||ctx.dead())return;if(!guard(400))return;stopSeq();
    if(cnt===q.target){locked=true;fr.classList.remove('tap');ctx.finish(tries===0,q)}
    else{
      tries++;SFX.bad();fr.style.animation='shake .4s';setTimeout(()=>fr.style.animation='',420);
      if(tries>=ctx.maxTries){locked=true;fr.classList.remove('tap');cnt=q.target;draw();ctx.finish(false,q,true)}
      else{const h=cnt<q.target?'還不夠喔，再數一數。':'畫太多了，擦掉一些。';setFb(host,h,'bad');speakSeq([h])}
    }
  };
  ctx.frame=fr;
  ctx.auto=()=>{cnt=q.target;draw();_lastTap=0;ok.onclick()};
  ctx.autoWrong=()=>{if(locked)return false;cnt=q.target===10?9:q.target+1;draw();_lastTap=0;ok.onclick();return true};
  ctx.speakTail=[];ctx.speakEnd=()=>{};
  afterBuild(host);
}

/* ---- 多的畫掉 ---- */
function rCross(q,host,ctx){
  q.noCount=true;buildShell(q,host,ctx);
  const bar=document.createElement('div');bar.className='drawbar';
  bar.innerHTML='<button class="btn r">重來</button><button class="btn g big">畫好了</button>';
  ctx.side.appendChild(bar);
  const items=$$('.fig .ct',host),[rs,ok]=$$('.btn',bar);
  let tries=0,locked=false;
  items.forEach(el=>el.onclick=e=>{e.stopPropagation();if(locked||ctx.dead())return;if(!guard(150))return;el.classList.toggle('x');SFX.tap()});
  rs.onclick=()=>{if(locked)return;items.forEach(x=>x.classList.remove('x'));SFX.tap()};
  const left=()=>items.filter(x=>!x.classList.contains('x')).length;
  ok.onclick=()=>{
    if(locked||ctx.dead())return;if(!guard(400))return;stopSeq();
    if(left()===q.target){locked=true;ctx.finish(tries===0,q)}
    else{tries++;SFX.bad();
      if(tries>=ctx.maxTries){locked=true;items.forEach((x,i)=>x.classList.toggle('x',i>=q.target));ctx.finish(false,q,true)}
      else{const h=left()>q.target?'還剩太多，再畫掉一些。':'畫掉太多了，按「重來」再試一次。';setFb(host,h,'bad');speakSeq([h])}}
  };
  ctx.auto=()=>{items.forEach((x,i)=>x.classList.toggle('x',i>=q.target));_lastTap=0;ok.onclick()};
  ctx.autoWrong=()=>{if(locked)return false;items.forEach(x=>x.classList.remove('x'));_lastTap=0;ok.onclick();return true};
  ctx.speakTail=[];ctx.speakEnd=()=>{};
  afterBuild(host);
}

/* ---- 連連看 ---- */
function rMatch(q,host,ctx){
  buildShell(q,host,ctx);
  const P=q.pairs.map((p,i)=>({l:p[0],r:p[1],ls:p[2],rs:p[3],i}));
  const R=shuffle(P);
  const g=document.createElement('div');g.className='mt';
  const lb=[],rb=[];
  P.forEach((p,k)=>{
    const a=document.createElement('button');a.innerHTML=p.l;a.dataset.i=p.i;g.appendChild(a);lb.push(a);
    const b=document.createElement('button');b.innerHTML=R[k].r;b.dataset.i=R[k].i;g.appendChild(b);rb.push(b);
  });
  ctx.side.appendChild(g);
  let sel=null,bad=0,left=P.length,locked=false;
  const clickL=b=>{if(locked||ctx.dead()||b.classList.contains('done'))return;if(!guard(150))return;lb.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;SFX.tap();speakSeq([P[+b.dataset.i].ls||''])};
  const clickR=b=>{
    if(locked||ctx.dead()||b.classList.contains('done'))return;
    if(!sel){if(!guard(150))return;SFX.tap();speakSeq(['先點左邊。']);return}
    if(!guard(220))return;stopSeq();
    if(sel.dataset.i===b.dataset.i){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;SFX.ok();left--;
      if(!left){locked=true;ctx.finish(bad===0,q)}}
    else{bad++;SFX.bad();b.classList.add('no');setTimeout(()=>b.classList.remove('no'),420);
      if(bad>=3){locked=true;lb.forEach(l=>{const r=rb.find(x=>x.dataset.i===l.dataset.i);l.classList.add('done');r.classList.add('done')});ctx.finish(false,q,true)}else ctx.hint(q)}
  };
  lb.forEach(b=>b.onclick=()=>clickL(b));rb.forEach(b=>b.onclick=()=>clickR(b));
  ctx.lb=lb;ctx.rb=rb;
  ctx.auto=()=>{lb.forEach(l=>{if(l.classList.contains('done'))return;_lastTap=0;clickL(l);const r=rb.find(x=>x.dataset.i===l.dataset.i);_lastTap=0;clickR(r)})};
  ctx.autoWrong=()=>{if(locked)return false;const l=lb.find(x=>!x.classList.contains('done'));const r=rb.find(x=>x.dataset.i!==l.dataset.i&&!x.classList.contains('done'));if(!r)return false;_lastTap=0;clickL(l);_lastTap=0;clickR(r);return true};
  ctx.speakTail=[];ctx.speakEnd=()=>{};
  afterBuild(host);
}

/* ---- 翻牌找好朋友（數學好好玩） ---- */
function rFlip(q,host,ctx){
  q.noCount=true;buildShell(q,host,ctx);
  const g=document.createElement('div');g.className='flips';
  const cards=shuffle(q.cards);
  cards.forEach(c=>{const b=document.createElement('button');b.className='fc';b.innerHTML=`<span class="back">？</span><span class="face">${grpHTML(c.k,c.n,{cols:c.n<=4?c.n:Math.ceil(c.n/2)})}</span>`;b._c=c;g.appendChild(b)});
  host.insertBefore(g,$('.fb',host));
  const bs=$$('.fc',g);let open=[],miss=0,got=0,locked=false;
  const flip=b=>{
    if(locked||ctx.dead()||b.classList.contains('up')||b.classList.contains('got')||open.length>=2)return;if(!guard(250))return;
    stopSeq();b.classList.add('up');SFX.swap();open.push(b);
    const c=b._c;speakSeq([`${c.n}${mw(c.k)}${nm(c.k)}`]);
    if(open.length===2){
      const [x,y]=open;
      if(x._c.n===y._c.n){later(()=>{x.classList.add('got');y.classList.add('got');x.classList.remove('up');y.classList.remove('up');open=[];got+=2;SFX.ok();confetti(6);
        speakSeq([`都是${x._c.n}，一樣多，是好朋友！`]);
        if(got>=bs.length){locked=true;later(()=>ctx.finish(miss<=2,q),900)}},800)}
      else{miss++;later(()=>{SFX.bad();speakSeq([`${x._c.n}和${y._c.n}，不一樣多。`]);later(()=>{x.classList.remove('up');y.classList.remove('up');open=[]},900)},900)}
    }
  };
  bs.forEach(b=>b.onclick=()=>flip(b));
  ctx.auto=()=>{bs.forEach(b=>b.classList.add('got'));locked=true;ctx.finish(true,q)};
  ctx.autoWrong=()=>false;
  ctx.speakTail=[];ctx.speakEnd=()=>{};
  afterBuild(host);
}

/* ---- 從少到多排排看 ---- */
function rOrder(q,host,ctx){
  q.noCount=true;buildShell(q,host,ctx);
  const sl=document.createElement('div');sl.className='chain';
  sl.innerHTML=q.ns.map((_,i)=>(i?'<span class="ar">→</span>':'')+'<span class="nd slot">&nbsp;</span>').join('');
  host.insertBefore(sl,$('.fb',host));
  const box=document.createElement('div');box.className='opts';
  const order=shuffle(q.ns.map((n,i)=>({n,i})));
  order.forEach((o,j)=>{const b=document.createElement('button');b.className='opt pic c'+(j%4);b.innerHTML=grpHTML(q.k,o.n,{size:'sm'});b._n=o.n;box.appendChild(b)});
  ctx.side.appendChild(box);
  const bs=$$('.opt',box),slots=$$('.slot',sl),sorted=q.ns.slice().sort((a,b)=>a-b);
  let k=0,bad=0,locked=false;
  const tap=b=>{
    if(locked||ctx.dead()||b.classList.contains('off'))return;if(!guard(280))return;stopSeq();
    if(b._n===sorted[k]){b.classList.add('off');slots[k].textContent=b._n;SFX.cnt(k);speakSeq([`${b._n}${mw(q.k)}`]);k++;
      if(k>=sorted.length){locked=true;ctx.finish(bad===0,q)}}
    else{bad++;SFX.bad();b.classList.add('no');setTimeout(()=>b.classList.remove('no'),420);
      if(bad>=3){locked=true;sorted.forEach((n,i)=>slots[i].textContent=n);bs.forEach(x=>x.classList.add('off'));ctx.finish(false,q,true)}
      else{const h='還有更少的，每一個都數一數。';setFb(host,h,'bad');speakSeq([h])}}
  };
  bs.forEach(b=>b.onclick=()=>tap(b));
  ctx.auto=()=>{sorted.slice(k).forEach(n=>{const b=bs.find(x=>x._n===n&&!x.classList.contains('off'));_lastTap=0;b&&tap(b)})};
  ctx.autoWrong=()=>{if(locked)return false;const b=bs.find(x=>x._n!==sorted[k]&&!x.classList.contains('off'));if(!b)return false;_lastTap=0;tap(b);return true};
  ctx.speakTail=[];ctx.speakEnd=()=>{};
  afterBuild(host);
}
const REND={mc:rMC,num:rNum,frame:rFrame,cross:rCross,match:rMatch,flip:rFlip,order:rOrder};

/* ================= 講解（一步一步，邊唸邊動） ================= */
// 講解項目 {t:唸的話, txt:畫面上的字(可html), on:動畫}
function exPlay(host,q,mode,done){
  const ex=q.ex&&q.ex(host,mode);
  if(!ex){done&&done();return}
  const items=ex.items.map(it=>({t:it.t,gap:it.gap,on:()=>{it.on&&it.on();const x=it.txt!=null?it.txt:esc(it.t);if(x)setFb(host,x,'ex',true)}}));
  if(mode==='help')items.push({t:'現在換你試試看。',on:()=>{setFb(host,'現在換你試試看！','ex')}});
  speakSeq(items,()=>{ex.end&&ex.end();done&&done()},380);
}
// 一個一個點著數（sel 可以只數某一群）
function cntItems(host,o){
  o=o||{};
  const els=$$(o.sel||'.fig .ct',host).filter(e=>!o.g||e.dataset.g===o.g);
  const items=[];
  items.push({t:o.intro||'我們用手指，一個一個點，一起數。',on:()=>{clearBadges(host);o.zone&&$$(o.zone,host).forEach(z=>z.classList.add('hl'))}});
  els.forEach((e,i)=>items.push({t:zh(i+1),txt:`<span class="bn">${i+1}</span>`,gap:o.fast?260:420,on:()=>{e.classList.add('hl');badge(e,i+1);SFX.cnt(i)}}));
  return {items,n:els.length,els};
}
function exCount(o){
  return (host)=>{
    const c=cntItems(host,o),n=c.n,u=o.u||'個',w=o.w||'';
    if(!n){
      c.items=[{t:o.zero||'仔細看，這裡面什麼都沒有。',on:()=>{o.zone&&$$(o.zone,host).forEach(z=>z.classList.add('hl'))}},{t:'什麼都沒有，就是0。',txt:'什麼都沒有，就是 <span class="bn">0</span>'}];
    }else{
      c.items.push({t:`最後數到${n}，所以一共有${n}${u}${w}。`,txt:`最後數到 <span class="bn">${n}</span>，一共有 ${n} ${u}${esc(w)}`});
      if(o.more)c.items=c.items.concat(o.more(n));
    }
    return {items:c.items,end:()=>{c.els.forEach(e=>e.classList.remove('hl'));o.zone&&$$(o.zone,host).forEach(z=>z.classList.remove('hl'))}};
  };
}

/* ================= 出題流程 ================= */
const QM={ctx:null,qs:[],idx:0,res:[],cfg:null,host:null,gen:0};
const PRAISE_SFX=[()=>{SFX.ok();confetti(14)},()=>{SFX.bird();SFX.ok();confetti(12,['🐦','🍃','✨'])},()=>{SFX.clap();confetti(12,['👏','⭐','✨'])},()=>{SFX.bell();confetti(12,['🌸','🌼','⭐'])}];
function qmStart(qs,cfg){
  QM.qs=qs;QM.idx=0;QM.res=[];QM.cfg=cfg;QM.host=cfg.host;QM.gen++;QM.pendingAdv=null;QM.p1=undefined;
  clearLater();stopSeq();
  qmShow();
}
function qmDead(gen){return gen!==QM.gen}
function setNextBtn(on){const b=$('#lvListen');if(!b)return;b.textContent=on?'下一題':'聽一聽';b.classList.toggle('y',!!on)}
function qmSkip(){const a=QM.pendingAdv;if(!a)return false;stopSeq();a();return true}
function qmProg(){
  const p=QM.cfg.prog;if(!p)return;
  p.innerHTML=QM.qs.map((_,i)=>`<i class="${i<QM.res.length?(QM.res[i]?'ok':'bad'):i===QM.idx?'cur':''}"></i>`).join('');
}
function qmShow(){
  setNextBtn(false);
  const gen=QM.gen,q=QM.qs[QM.idx];
  if(!q){QM.cfg.onEnd&&QM.cfg.onEnd(QM.res.slice());return}
  const host=QM.host;qmProg();if(!q._part2)QM.cfg.onShow&&QM.cfg.onShow(QM.idx,q);
  let teaching=false;
  const ctx={maxTries:QM.cfg.maxTries||2,
    dead:()=>qmDead(gen)||CLK.paused,
    hint(q){const h=q.hint||'再想一想，再試一次。';setFb(host,h,'bad');speakSeq([h])},
    finish(first,q,revealed){
      if(qmDead(gen))return;
      const cont=q.then;
      if(cont){QM.p1=first&&QM.p1!==false;cont._part2=true}else{first=first&&QM.p1!==false;QM.p1=undefined;QM.res.push(first)}
      qmProg();
      const tb=$('.teach',host);tb&&(tb.disabled=true);
      if(!cont)QM.cfg.onAnswer&&QM.cfg.onAnswer(first,q,!!revealed);

function drawPath(){
  const map=$('#map'),svg=$('#mapPath');if(!map||!svg||CURSCR!=='home')return;
  const r0=map.getBoundingClientRect();if(!r0.width)return;
  const pts=[1,2,3,4,5,6,7,8,9].map(id=>{const b=$(`#stops .stop[data-id="${id}"]`);if(!b)return null;const r=b.getBoundingClientRect();return [r.left-r0.left+r.width/2,r.top-r0.top+r.height/2]}).filter(Boolean);
  if(pts.length<2)return;
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  const u=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
  svg.setAttribute('viewBox',`0 0 ${r0.width} ${r0.height}`);
  svg.innerHTML=`<path d="${d}" fill="none" stroke="#c9a66b" stroke-width="${u*2}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#f6e3b4" stroke-width="${u*1.4}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#e2c58c" stroke-width="${u*.18}" stroke-dasharray="${u*.5} ${u*.9}" stroke-linecap="round"/>`;
}

function mkGroupQs(total){
  const rg={basic:[0,1,2],mid:[3,4],high:[5,6,7],all:[0,1,2,3,4,5,6,7]}[GCFG.range];
  const out=[];let last=-1;
  for(let i=0;i<total;i++){
    let qi=null;
    for(let t=0;t<12&&!qi;t++){let li;do{li=pick(rg)}while(li===last&&rg.length>1);
      const lv=LV[li],tier=pick([2,3]),pool=lv.mk.filter(x=>x[0]===tier).map(x=>x[1]);
      const q=tryMake(pick(pool),SEEN);if(q&&q.type!=='route'&&q.type!=='seq'&&q.type!=='paint'&&!q.then){qi=q;last=li}}
    if(qi)out.push(qi);
  }
  return out;
}

  const n=GCFG.teams,el=$('#teams');el.classList.remove('hide');
  el.style.gridTemplateColumns=`repeat(${n},1fr)`;el.classList.toggle('compact',n>=3);
  el.innerHTML=Array.from({length:n},(_,i)=>`<div class="team ${i===cur?'cur':''}" style="background:${TEAMS[i].c}"><span>${TEAMS[i].e}</span><b>${sc[i]}</b><span class="tw">${'🍀'.repeat(Math.min(sc[i],10))}</span></div>`).join('');

function startGroup(){

    qmStart(qs,{host:$('#qwrap'),prog:$('#prog'),maxTries:1,

      body.innerHTML=`<div class="chgrid">${PT_CHARS.map(c=>`<button class="chb ${PT.d.ch===c[0]?'sel':''}" data-c="${c[0]}"><span>${c[0]}</span><small>${c[1]}</small></button>`).join('')}</div><div class="row nmrow" style="margin-top:.5em"><span>名字（可以不填）</span><input id="ptName" maxlength="6" value="${esc(PT.d.name)}" placeholder="打你的名字"></div>`;
      body.querySelectorAll('.chb').forEach(b=>b.onclick=()=>{PT.d.ch=b.dataset.c;ptSave();ptRefresh();body.querySelectorAll('.chb').forEach(x=>x.classList.toggle('sel',x===b));SFX.ok();const c=PT_CHARS.find(x=>x[0]===PT.d.ch);speakSeq([`你選了${c[1]}。`])});
      const ni=body.querySelector('#ptName');ni.oninput=()=>{PT.d.name=ni.value.trim().slice(0,6);ptSave();ptRefresh()};
    }else if(t==='s'){
      body.innerHTML=`<div class="ptnow">${avHTML('big')}<b>⭐ ${PT.d.pts} 點</b></div><div class="shopg">${PT_SHOP.map(s=>{const own=PT.d.own.includes(s[0]);return `<button class="shb ${own?'own':''}" data-e="${s[0]}"><span>${s[0]}</span><small>${s[1]}</small><em>${own?'已經有了':'⭐'+s[2]}</em></button>`}).join('')}</div>`;
      body.querySelectorAll('.shb').forEach(b=>b.onclick=()=>{
        if(!guard(300))return;const s=PT_SHOP.find(x=>x[0]===b.dataset.e);
        if(PT.d.own.includes(s[0])){PT.d.wear=s[0];ptSave();ptRefresh();SFX.swap();speakSeq([`${chN()}帶上了${s[1]}。`]);tab('s');return}
        if(PT.d.pts<s[2]){SFX.bad();speakSeq([`${s[1]}要${s[2]}點，還差${s[2]-PT.d.pts}點。多答對幾題就可以買了！`]);b.classList.remove('no');void b.offsetWidth;b.classList.add('no');return}
        PT.d.pts-=s[2];PT.d.own.push(s[0]);PT.d.wear=s[0];ptSave();ptRefresh();SFX.fanfare();confetti(24,[s[0],'✨','⭐']);speakSeq([`買到了${s[1]}！${chN()}帶上了${s[1]}。`]);tab('s');
      });
    }else{
      body.innerHTML=PT.d.own.length?`<div class="sub" style="text-align:center">點一下，讓角色帶上這個寶物</div><div class="shopg">${PT.d.own.map(e=>{const s=PT_SHOP.find(x=>x[0]===e)||[e,''];return `<button class="shb ${PT.d.wear===e?'sel':''}" data-e="${e}"><span>${e}</span><small>${s[1]}</small></button>`}).join('')}<button class="shb" data-e=""><span>🚫</span><small>不帶</small></button></div>`:`<div class="ptempty">還沒有寶物。<br>答對題目得到點數，就可以到「獎勵商店」買喔！</div>`;
      body.querySelectorAll('.shb').forEach(b=>b.onclick=()=>{PT.d.wear=b.dataset.e||null;ptSave();ptRefresh();SFX.tap();tab('b')});
    }};
  p.querySelectorAll('.ptabs .btn').forEach(b=>b.onclick=()=>{SFX.tap();tab(b.dataset.t);
    speakSeq([b.dataset.t==='c'?'選一個你喜歡的角色。':b.dataset.t==='s'?`你有${PT.d.pts}點。點一個寶物，就可以用點數買。`:'這些是你買到的寶物。'])});
  p.querySelector('#ptOk').onclick=()=>{if(!PT.d.ch){PT.d.ch=PT_CHARS[0][0];ptSave()}ptRefresh();stopSeq();ov.classList.remove('on');if(CURSCR==='home')renderHome()};
  tab('c');ov.classList.add('on');
  speakSeq([first?'選一個你喜歡的角色。答對題目，可以得到點數，再到獎勵商店買寶物喔！':'選角色，或用點數買寶物。']);
}

/* ---------- 初始化 ---------- */
function init(){
  initCover();
  $$('.vbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleVoice()});syncVoice();
  $$('.spSlow').forEach(b=>b.onclick=()=>{if(guard(250))stepRate(-1)});
  $$('.spFast').forEach(b=>b.onclick=()=>{if(guard(250))stepRate(1)});
  $('#dkClass').onclick=()=>{if(guard(350))openClass()};
  $('#dkGroup').onclick=()=>{if(guard(350))openGroupSetup()};
  $('#dkDaily').onclick=()=>{if(guard(350))startDaily()};
  $('#dkSet').onclick=()=>{if(guard(350))openSettings()};
  $('#lvHome').onclick=()=>{if(guard(300))askExit()};
  $('#lvPause').onclick=()=>{if(guard(300))pauseGame()};
  $('#clsPause').onclick=()=>{if(guard(300))pauseGame()};
  $('#lvListen').onclick=()=>{if(!guard(300)||CLK.paused)return;if(!qmSkip())qmReplay()};
  $('#clsHome').onclick=()=>{stopSeq();clearLater();go('home')};
  $$('#clsTabs .btn').forEach((b,i)=>b.onclick=()=>{if(!guard(300))return;CLS.scene=i;SFX.tap();renderClass()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if((CURSCR==='level'||CURSCR==='class')&&!CLK.paused)pauseGame();else TTS.stop()}});
  const bar=$('#home .bar'),sp=bar&&bar.querySelector('.sp');
  if(sp)sp.insertAdjacentHTML('afterend','<button class="btn ptchip" id="ptChip"></button>');
  $('#ptChip').onclick=()=>{if(guard(350))openChar(false)};
  ptRefresh();
  window.__M11={S,go,startFloor,startBoss,startDaily,startGroup,GCFG,QM,LV,buildQs,buildBoss,CLK,RUN:()=>RUN,openClass,openSettings,PT,LES};
  go('cover');
}
init();
</script>
