<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>火車算術大冒險</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(180deg, #bae6fd, #e0f7fa 60%, #f0fdf4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%; max-width: 580px; height: 100%; max-height: 100dvh;
            background: #ffffff; border: 4px solid #90caf9; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            gap: 6px; position: relative; overflow-y: auto;
        }

        #home-screen { text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 4px; }
        h1 { font-size: 21px; color: #1565c0; margin: 4px 0; }
        .subtitle { color: #0284c7; font-size: 12px; font-weight: bold; margin: 0 0 8px 0; }

        .intro-card {
            background: #f0f9ff; border: 2px solid #bae6fd; border-radius: 12px;
            padding: 8px 14px; margin-bottom: 10px; width: 100%; box-sizing: border-box; text-align: left;
        }
        .intro-card h3 { margin: 0 0 4px 0; font-size: 13px; color: #0369a1; }
        .intro-card ul { margin: 0; padding-left: 18px; font-size: 12px; color: #334155; line-height: 1.5; }
        .intro-card li { margin-bottom: 3px; }

        .level-pick-title { font-size: 13px; font-weight: bold; color: #0369a1; margin: 4px 0 6px 0; width: 100%; text-align: left; }
        .level-btn {
            width: 100%; text-align: left; background: #fff; border: 2px solid #bae6fd;
            border-radius: 12px; padding: 9px 14px; margin-bottom: 8px; cursor: pointer;
            display: flex; flex-direction: column; gap: 2px;
        }
        .start-btn { padding: 12px 30px; font-size: 22px; font-weight: bold; background-color: #0ea5e9; color: white; border-radius: 16px; cursor: pointer; box-shadow: 0px 4px 10px rgba(0,0,0,0.2); border: none; width: 100%; max-width: 260px; }
        .start-btn:active { transform: scale(0.95); background-color: #0284c7; }
        .level-btn:active { transform: scale(0.98); background: #f0f9ff; }
        .level-btn .lv-name { font-size: 14px; font-weight: bold; color: #0369a1; }
        .level-btn .lv-desc { font-size: 11px; color: #475569; }

        #game-ui { text-align: center; width: 100%; display: none; flex-direction: column; align-items: center; flex: 1 1 auto; min-height: 0; }

        #status-bar {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            font-size: 13px; font-weight: bold; color: #2c3e50; border-bottom: 2px solid #e0f2fe;
            padding-bottom: 4px; margin-bottom: 4px; flex-wrap: wrap; row-gap: 4px; flex-shrink: 0;
        }
        .status-left { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
        .status-left .level-label { font-size: 11px; color: #0369a1; }

        .btn-group { display: flex; gap: 4px; flex-wrap: wrap; row-gap: 4px; }
        .control-btn {
            padding: 5px 9px; font-size: 12px; background: #1976d2; color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; touch-action: manipulation;
        }
        .control-btn:active { background: #0d47a1; transform: scale(0.95); }
        .pause-btn-el { background: #f59e0b; }
        .hint-btn-el { background: #16a34a; }
        .switch-btn-el { background: #64748b; }

        .speed-row { display: flex; gap: 4px; width: 100%; justify-content: center; margin-bottom: 4px; flex-shrink: 0; }
        .speed-btn {
            flex: 1; max-width: 100px; background: #f0f9ff; color: #0369a1; border: 2px solid #bae6fd;
            border-radius: 8px; padding: 4px 4px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .speed-btn.active { background: #1976d2; color: #fff; border-color: #0d47a1; }
        .speed-btn:active { transform: scale(0.95); }

        /* 火車視覺區：藍天草地場景 */
        #visual-area {
            height: 130px; width: 100%; display: grid; grid-template-columns: repeat(5, 1fr);
            align-items: center; justify-items: center; gap: 2px;
            background: linear-gradient(to bottom, #e0f2fe 65%, #86efac 65%, #86efac 72%, #f8fafc 72%);
            border-radius: 12px; border: 2px dashed #90caf9; padding: 4px; flex-shrink: 0; overflow: hidden;
        }
        .train-car { font-size: 44px; line-height: 1; transition: transform 1.5s ease-in-out, opacity 1.5s ease-in-out; }
        .entering { transform: translateX(40vw); opacity: 0; }
        .exiting { transform: translateX(40vw); opacity: 0; }

        #equation { font-size: 30px; font-weight: bold; color: #1565c0; margin: 4px 0; flex-shrink: 0; }
        #feedback { font-size: 15px; color: #d84315; font-weight: bold; min-height: 22px; margin: 2px 0; flex-shrink: 0; }

        /* 降落傘掉落區：藍天配薄雲 */
        #drop-game-container {
            position: relative; width: 100%; height: 150px; min-height: 150px; flex-grow: 1; max-height: 250px;
            background: linear-gradient(180deg, #93c5fd 0%, #bfdbfe 60%, #e0f2fe 100%);
            border: 3px solid #60a5fa; border-radius: 14px;
            overflow: hidden; touch-action: manipulation;
        }
        #drop-game-container::before, #drop-game-container::after {
            content: '☁️'; position: absolute; font-size: 26px; opacity: 0.7;
        }
        #drop-game-container::before { top: 10px; left: 12%; }
        #drop-game-container::after { top: 30px; right: 15%; }

        /* 降落傘：圓頂傘罩 + 傘繩 + 底下的小籃子裝著數字 */
        .falling-option {
            position: absolute; width: 76px; height: 92px;
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; z-index: 99;
            animation: parachuteDrift linear forwards;
        }
        .chute-canopy {
            width: 68px; height: 40px;
            border-radius: 50% 50% 4px 4px / 100% 100% 4px 4px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.25), inset 0 -4px 8px rgba(0,0,0,0.15);
        }
        .chute-strings { width: 100%; height: 14px; position: relative; }
        .chute-strings::before, .chute-strings::after {
            content: ''; position: absolute; top: 0; width: 1.5px; height: 14px; background: #475569;
        }
        .chute-strings::before { left: 18px; transform: rotate(8deg); transform-origin: top; }
        .chute-strings::after { right: 18px; transform: rotate(-8deg); transform-origin: top; }
        .chute-basket {
            width: 44px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: bold; color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            box-shadow: 0 3px 6px rgba(0,0,0,0.25);
        }
        .falling-option:active { transform: scale(0.92); }
        .falling-option.hint-glow .chute-canopy { box-shadow: 0 0 0 4px #fde047, 0 3px 8px rgba(0,0,0,0.3); }
        .falling-option.popping { animation: chutePop 0.32s ease-out forwards !important; pointer-events: none; }
        @keyframes chutePop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        @keyframes parachuteDrift {
            0%   { top: -95px; margin-left: 0px; }
            25%  { margin-left: 14px; }
            50%  { margin-left: -12px; }
            75%  { margin-left: 10px; }
            100% { top: 260px; margin-left: 0px; }
        }

        #completeOverlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.97); border-radius: 18px; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px; z-index: 5000; text-align: center; padding: 16px;
        }
        #completeOverlay .equation-big {
            font-family: monospace; font-size: 26px; font-weight: bold; color: #1565c0;
            background: #f0f9ff; border: 3px solid #bae6fd; border-radius: 10px; padding: 10px 18px;
        }
        #completeOverlay .cheer { font-size: 16px; font-weight: bold; color: #0369a1; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="home-screen">
        <h1>🚂 火車車廂算術冒險</h1>
        <p class="subtitle">🪂 降落傘找答案 × 語音互動 × 加減法練習</p>

        <div class="intro-card">
            <h3>📖 遊戲怎麼玩：</h3>
            <ul>
                <li>仔細看火車車廂的變化——開來新車廂，或開走一節車廂。</li>
                <li>算出現在總共有幾節車廂。</li>
                <li>天空飄下來的降落傘上有數字，點對答案的降落傘就能過關！</li>
                <li>卡住了嗎？按「💡提示」會給你線索！</li>
                <li>題目會先從簡單的加減 1 開始，慢慢加深難度喔！</li>
            </ul>
        </div>

        <button class="start-btn" id="startBtn" onclick="startGame()">🎮 開始遊戲</button>
    </div>

    <div id="game-ui">
        <div id="status-bar">
            <div class="status-left">
                <span id="score">闖關: 0</span>
            </div>
            <div class="btn-group">
                <button class="control-btn hint-btn-el" onclick="useHint()">💡提示</button>
                <button class="control-btn pause-btn-el" id="pauseBtn" onclick="togglePause()">暫停</button>
                <button class="control-btn switch-btn-el" onclick="restartGame()">🔄重新開始</button>
            </div>
        </div>

        <div class="speed-row">
            <button class="speed-btn" id="speedSlow" onclick="setSpeed('slow')">🐢慢</button>
            <button class="speed-btn active" id="speedNormal" onclick="setSpeed('normal')">🚶正常</button>
            <button class="speed-btn" id="speedFast" onclick="setSpeed('fast')">🐇快</button>
        </div>

        <div id="visual-area"></div>
        <div id="equation">?</div>
        <div id="feedback">請觀察火車變化...</div>

        <div id="drop-game-container"></div>

        <div id="completeOverlay">
            <div class="equation-big" id="completeEquation">3 + 1 = 4</div>
            <div class="cheer">🌟 太棒了，過關了！</div>
        </div>
    </div>
</div>

<script>
    let questionCount = 0; // 追蹤目前是第幾題，用來決定難度要提升到多少

    // 難度隨題數漸進提升：一開始都是加減1的基本題，多練習幾題後才加深，
    // 前面刻意安排較多簡單題，不會太快跳到最難的加減3。
    function getDifficultyForQuestion() {
        if (questionCount < 8) return { step: 1, maxCount: 10 };
        if (questionCount < 14) return { step: 2, maxCount: 10 };
        return { step: 3, maxCount: 10 };
    }

    // 車廂造型色票：每一輪隨機挑一種，避免每次玩都看到一樣的畫面。
    const TRAIN_ICON_POOL = ['🚃', '🚋', '🚞', '🚝'];

    let gameStarted = false;
    let currentCount = 3, score = 0;
    let currentTrainIcon = '🚃';
    let gameInterval = null;
    let nextQuestionTimeout = null;
    let activeOptions = [];
    let isAnswered = false;
    let isPaused = false;
    let pendingNextQuestion = false;
    let currentAns = 0;
    let audioCtx = null;
    let hintLevel = 0;
    let hintActiveValue = null;
    let speedMode = 'normal';
    let currentActionSign = '+';

    const SPEED_SETTINGS = {
        slow:   { fallDuration: 8,   spawnInterval: 2600 },
        normal: { fallDuration: 5.5, spawnInterval: 2000 },
        fast:   { fallDuration: 3.5, spawnInterval: 1300 }
    };

    /* ============================================================
       語音函式：修正原本的嚴重臭蟲——原本完全依賴 onend 回呼函式
       才會繼續遊戲流程，如果某些手機上語音失敗、onend 沒有被觸發，
       整個遊戲就會永遠卡住。現在加上保險計時器，語音萬一沒反應，
       最多等一下還是會自動繼續，不會卡死。
       不額外加播放前延遲、不指定特定聲音物件——維持最單純可靠的寫法。
       ============================================================ */
    function speakText(text, callback) {
        if (!('speechSynthesis' in window)) { if (callback) callback(); return; }
        try {
            window.speechSynthesis.cancel();
            let finished = false;
            const trigger = () => { if (finished) return; finished = true; if (callback) callback(); };
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.8;
            utterance.onend = trigger;
            utterance.onerror = trigger;
            window.speechSynthesis.speak(utterance);
            setTimeout(trigger, Math.max(1800, text.length * 320 / 0.8));
        } catch (e) { if (callback) callback(); }
    }

    function boom() { try { confetti({ particleCount: 130, spread: 80, origin: { y: 0.6 } }); } catch (e) {} }

    function playPopSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(950, now + 0.09);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.17);
        } catch (e) {}
    }

    function restartGame() {
        isPaused = false;
        pendingNextQuestion = false;
        gameStarted = false;
        questionCount = 0;
        if (gameInterval) clearInterval(gameInterval);
        if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
        activeOptions.forEach(el => el.remove());
        activeOptions = [];
        hideCompletionScreen();
        try { window.speechSynthesis.cancel(); } catch (e) {}
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
    }

    function startGame() {
        if (document.getElementById('home-screen').style.display === 'none') return;
        gameStarted = true;
        questionCount = 0;

        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        try { window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}

        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
        score = 0;
        currentCount = 1 + Math.floor(Math.random() * 10);
        document.getElementById('score').innerText = `闖關: ${score}`;
        const pauseBtn = document.getElementById('pauseBtn');
        pauseBtn.innerText = "暫停"; pauseBtn.style.backgroundColor = "#f59e0b";
        playRound();
    }

    function setSpeed(mode) {
        speedMode = mode;
        ['slow', 'normal', 'fast'].forEach(m => {
            document.getElementById('speed' + m.charAt(0).toUpperCase() + m.slice(1)).classList.toggle('active', m === mode);
        });
        if (!isPaused && !isAnswered && gameStarted) startFallingLoop();
    }

    function togglePause() {
        if (!gameStarted) return;
        isPaused = !isPaused;
        const pauseBtn = document.getElementById('pauseBtn');

        if (isPaused) {
            pauseBtn.innerText = "繼續";
            pauseBtn.style.backgroundColor = "#16a34a";
            document.getElementById('feedback').innerText = "⏸️ 遊戲已暫停，慢慢思考喔！";
            activeOptions.forEach(el => el.style.animationPlayState = 'paused');
            if (gameInterval) clearInterval(gameInterval);
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
            try { window.speechSynthesis.cancel(); } catch (e) {}
        } else {
            pauseBtn.innerText = "暫停";
            pauseBtn.style.backgroundColor = "#f59e0b";
            document.getElementById('feedback').innerText = "";
            activeOptions.forEach(el => el.style.animationPlayState = 'running');
            if (pendingNextQuestion) {
                pendingNextQuestion = false;
                hideCompletionScreen();
                playRound();
            } else if (!isAnswered) {
                startFallingLoop();
            }
        }
    }

    function showCompletionScreen() {
        document.getElementById('completeEquation').innerText = `${document.getElementById('equation').innerText.replace('?', currentAns)}`;
        document.getElementById('completeOverlay').style.display = 'flex';
    }
    function hideCompletionScreen() {
        document.getElementById('completeOverlay').style.display = 'none';
    }

    async function playRound() {
        if (!gameStarted) return;
        isAnswered = false;
        hintLevel = 0;
        hintActiveValue = null;
        hideCompletionScreen();

        let area = document.getElementById('visual-area');
        let eq = document.getElementById('equation');
        let feedback = document.getElementById('feedback');

        activeOptions.forEach(el => el.remove());
        activeOptions = [];
        if (gameInterval) clearInterval(gameInterval);

        const tier = getDifficultyForQuestion();
        questionCount++;
        const STEP = tier.step;
        const MAX_COUNT = tier.maxCount;
        currentTrainIcon = TRAIN_ICON_POOL[Math.floor(Math.random() * TRAIN_ICON_POOL.length)];

        let action = Math.random() > 0.5 ? 'add' : 'sub';
        if (currentCount + STEP > MAX_COUNT) action = 'sub';
        if (currentCount - STEP < 1) action = 'add';
        currentActionSign = action === 'add' ? '+' : '-';

        renderTrain(currentCount);
        feedback.innerText = "仔細看火車喔！";

        await new Promise(r => setTimeout(r, 1000));
        if (isPaused) return;

        if (action === 'add') {
            let nextCount = currentCount + STEP;
            eq.innerText = `${currentCount} + ${STEP} = ?`;
            currentAns = nextCount;

            let promptText = STEP === 1
                ? `原本有 ${currentCount} 節車廂，開來了一節新車廂。`
                : `原本有 ${currentCount} 節車廂，開來了 ${STEP} 節新車廂。`;
            feedback.innerText = promptText;

            speakText(promptText, async () => {
                if (isPaused) return;
                await new Promise(r => setTimeout(r, 400));
                for (let i = 0; i < STEP; i++) {
                    let t = document.createElement('div');
                    t.className = 'train-car entering';
                    t.innerText = currentTrainIcon;
                    area.appendChild(t);
                    await new Promise(r => setTimeout(r, 80));
                    t.classList.remove('entering');
                    // 等車廂真的滑進來、淡入完(跟CSS動畫的1.5秒同步)，
                    // 小朋友才能看清楚「開來了一節新車廂」。
                    await new Promise(r => setTimeout(r, 1600));
                    if (isPaused) return;
                }

                await new Promise(r => setTimeout(r, 500));
                if (isPaused) return;
                currentCount = nextCount;

                let finalAsk = "現在一共有幾節車廂呢？降落傘飄下來囉！";
                feedback.innerText = finalAsk;
                speakText(finalAsk);
                startFallingLoop();
            });

        } else {
            let nextCount = currentCount - STEP;
            eq.innerText = `${currentCount} - ${STEP} = ?`;
            currentAns = nextCount;

            let promptText = STEP === 1
                ? `原本有 ${currentCount} 節車廂，開走了一節車廂。`
                : `原本有 ${currentCount} 節車廂，開走了 ${STEP} 節車廂。`;
            feedback.innerText = promptText;

            speakText(promptText, async () => {
                if (isPaused) return;
                await new Promise(r => setTimeout(r, 400));
                for (let i = 0; i < STEP; i++) {
                    let lastCar = area.lastElementChild;
                    if (lastCar) lastCar.classList.add('exiting');
                    // 等車廂真的滑出、淡出完(跟CSS動畫的1.5秒同步)，
                    // 小朋友才能看清楚「這一節開走了」，不會憑空消失。
                    await new Promise(r => setTimeout(r, 1600));
                    if (lastCar) lastCar.remove();
                    if (isPaused) return;
                }

                await new Promise(r => setTimeout(r, 500));
                if (isPaused) return;
                currentCount = nextCount;
                renderTrain(currentCount);

                let finalAsk = "現在還剩下幾節車廂呢？降落傘飄下來囉！";
                feedback.innerText = finalAsk;
                speakText(finalAsk);
                startFallingLoop();
            });
        }
    }

    function renderTrain(count) {
        let area = document.getElementById('visual-area');
        area.innerHTML = '';
        for (let i = 0; i < count; i++) {
            let t = document.createElement('div');
            t.className = 'train-car';
            t.innerText = currentTrainIcon;
            area.appendChild(t);
        }
    }

    function startFallingLoop() {
        if (!gameStarted || isPaused || isAnswered) return;
        let options = new Set([currentAns]);
        let attempts = 0;
        while (options.size < 4 && attempts < 100) {
            attempts++;
            let rand = 1 + Math.floor(Math.random() * 10);
            options.add(rand);
        }
        let optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

        if (gameInterval) clearInterval(gameInterval);
        let index = 0;
        gameInterval = setInterval(() => {
            if (isPaused) return;
            if (isAnswered) { clearInterval(gameInterval); return; }
            if (index >= optionsArr.length) index = 0;
            spawnFallingOption(optionsArr[index]);
            index++;
        }, SPEED_SETTINGS[speedMode].spawnInterval);
    }

    function useHint() {
        if (isPaused || isAnswered || !gameStarted) return;
        hintLevel++;
        if (hintLevel === 1) {
            const dirText = currentActionSign === '+' ? '再多算一點' : '要算少一點';
            speakText(`用手指點著車廂數一數，${dirText}喔！`);
        } else {
            speakText(`答案是 ${currentAns}，找找看天空中這個數字的降落傘！`);
            hintActiveValue = currentAns;
            activeOptions.forEach(opt => { if (opt.dataset.val === String(currentAns)) opt.classList.add('hint-glow'); });
        }
    }

    const CHUTE_COLORS = [
        ['#fca5a5', '#dc2626'], ['#fdba74', '#c2410c'], ['#fde047', '#ca8a04'],
        ['#86efac', '#16a34a'], ['#93c5fd', '#1d4ed8'], ['#c4b5fd', '#7c3aed']
    ];

    function spawnFallingOption(val) {
        if (isAnswered || isPaused) return;
        const container = document.getElementById('drop-game-container');
        const el = document.createElement('div');
        el.className = 'falling-option';
        el.dataset.val = String(val);
        if (hintActiveValue !== null && val === hintActiveValue) el.classList.add('hint-glow');

        const [light, dark] = CHUTE_COLORS[Math.floor(Math.random() * CHUTE_COLORS.length)];
        el.innerHTML = `
            <div class="chute-canopy" style="background: radial-gradient(circle at 35% 25%, ${light}, ${dark});"></div>
            <div class="chute-strings"></div>
            <div class="chute-basket" style="background: ${dark};">${val}</div>
        `;

        const randomX = Math.random() * (container.clientWidth - 76);
        el.style.left = randomX + 'px';
        el.style.animationDuration = SPEED_SETTINGS[speedMode].fallDuration + 's';
        if (isPaused) el.style.animationPlayState = 'paused';

        let isHandled = false;
        const handleSelect = function (e) {
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
            if (isAnswered || isPaused || isHandled) return;
            isHandled = true;

            if (val === currentAns) {
                isAnswered = true;
                score++;
                document.getElementById('score').innerText = `闖關: ${score}`;

                playPopSound();
                el.classList.add('popping');
                setTimeout(() => el.remove(), 320);
                if (gameInterval) clearInterval(gameInterval);
                activeOptions.forEach(opt => { if (opt !== el) opt.remove(); });
                activeOptions = [];

                document.getElementById('feedback').innerText = "太棒了！👍";
                setTimeout(() => boom(), 150);
                showCompletionScreen();

                pendingNextQuestion = true;
                const goNext = () => {
                    if (!pendingNextQuestion) return;
                    if (isPaused) return;
                    if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                    pendingNextQuestion = false;
                    playRound();
                };
                speakText("太棒了！", () => {
                    if (!pendingNextQuestion) return;
                    if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                    nextQuestionTimeout = setTimeout(goNext, 1200);
                });
                if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                nextQuestionTimeout = setTimeout(goNext, 5500);

            } else {
                isHandled = true;
                speakText("再算算看喔！");
                document.getElementById('feedback').innerText = "❌ 數字不對喔，再試一次！";
                el.style.transition = "opacity 0.3s";
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 300);
            }
        };

        el.addEventListener('pointerdown', handleSelect);
        el.addEventListener('animationend', () => {
            el.remove();
            activeOptions = activeOptions.filter(item => item !== el);
        });

        container.appendChild(el);
        activeOptions.push(el);
    }

</script>
</body>
</html>
